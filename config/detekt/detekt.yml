# Config mínima de detekt. Los defaults cubren el resto.
build:
  maxIssues: 0

complexity:
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    threshold: 6

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  # La frontera I7 convierte excepciones de IO/JSON en LinguaError: el error
  # se traslada como valor tipado, la excepción original no se propagará.
  SwallowedException:
    active: false
