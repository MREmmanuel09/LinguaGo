# CI LinguaGo (RFC §8.2): build + ktlint + detekt + tests + release (R8)
# por cada push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build · ktlint · detekt · tests · release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # `tools` ya no existe en el repository.xml moderno y hace fallar el
          # paso; platform-tools viene preinstalado en el runner.
          packages: platform-tools

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: ktlint + detekt + validateContent + tests
        run: ./gradlew ktlintCheck detekt validateContent test

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: assembleRelease (R8 + shrink, sin keystore de distribución)
        run: ./gradlew assembleRelease

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: linguago-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK (release sin firmar de distribución)
        uses: actions/upload-artifact@v4
        with:
          name: linguago-release-unsigned-dev
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore

  instrumented:
    name: Instrumented · core-ui (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Enable KVM (aceleración del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: connectedDebugAndroidTest (accesibilidad del design system)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :core:core-ui:connectedDebugAndroidTest

      - name: Upload instrumented reports (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
