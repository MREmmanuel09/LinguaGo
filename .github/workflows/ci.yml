# CI LinguaGo (RFC §8.2): build + ktlint + detekt + tests + release (R8)
# por cada push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build · ktlint · detekt · tests · release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # `tools` ya no existe en el repository.xml moderno y hace fallar el
          # paso; platform-tools viene preinstalado en el runner.
          packages: platform-tools

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: ktlint + detekt + validateContent + tests
        run: ./gradlew ktlintCheck detekt validateContent test

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: assembleRelease (R8 + shrink, sin keystore de distribución)
        run: ./gradlew assembleRelease

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: linguago-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK (release sin firmar de distribución)
        uses: actions/upload-artifact@v4
        with:
          name: linguago-release-unsigned-dev
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
