name: Reporte de error
description: Algo no funciona como debería
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de reportar! Antes de continuar, busca
        en los issues existentes si ya está reportado.

        ⚠️ Para **vulnerabilidades de seguridad** NO uses este formulario:
        sigue [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Comportamiento actual, claro y conciso.
      placeholder: Al abrir la lección X, la app…
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir Ajustes → …
        2. Tocar …
        3. Ver …
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde ocurre?
      options:
        - Dispositivo físico
        - Emulador
        - Build/debug (Gradle)
        - No estoy seguro
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Versión de la app (Ajustes), modelo/Android o API del emulador.
      placeholder: "0.2.0 · Pixel 7 · Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Capturas, logs o notas
      description: Si hay crash, adjunta el stacktrace si puedes (logcat solo de la app).
    validations:
      required: false
